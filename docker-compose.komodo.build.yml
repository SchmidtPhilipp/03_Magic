# Komodo build-on-host — MTG optimizer on CT 167
services:
  mtg-optimizer:
    build: .
    image: mtg-optimizer:local
    container_name: mtg-optimizer
    restart: unless-stopped
    ports:
      - "${MAGIC_PORT:-5050}:5050"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: production
      PORT: "5050"
      SECRET_KEY: ${SECRET_KEY:-}
    command: ["python", "web_app.py"]
