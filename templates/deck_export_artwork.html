<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ deck_name }} - Deck Export with Artwork</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .deck-container {
            max-width: 900px;
            margin: 2rem auto;
            background: #292929;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 16px #000a;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        .card-entry {
            background: #181818;
            border-radius: 8px;
            padding: 1rem;
            width: 200px;
            box-shadow: 0 1px 8px #0006;
            text-align: center;
        }

        .card-entry img {
            width: 180px;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            background: #333;
        }

        .card-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }

        .card-qty {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 600px) {
            .card-entry {
                width: 120px;
                padding: 0.5rem;
            }

            .card-entry img {
                width: 100px;
                height: 140px;
            }
        }
    </style>
</head>

<body>
    <div class="deck-container">
        <h1>{{ deck_name }}</h1>
        <div class="card-list">
            {% for card in deck %}
            <div class="card-entry">
                <img src="/static/card_cache/{{ card.name.replace(' ', '_').replace(',', '').replace(':', '').replace("'", "") }}.jpg" alt="{{ card.name }}">
                    <div class="card-name">{{ card.name }}</div>
                    <div class="card-qty">x{{ card.quantity if card.quantity else 1 }}</div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
